name: Fabric build
on:
  push:
    paths: ['fabric-mod/**']
  pull_request:
    paths: ['fabric-mod/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'
      - name: Build Fabric mod
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: rpmod-fabric-0.1.0-mc26.3
          path: fabric-mod/build/libs/rpmod-0.1.0.jar
          if-no-files-found: error
